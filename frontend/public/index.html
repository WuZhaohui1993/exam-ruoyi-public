<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>logo.svg">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
	  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }
    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 999999;
      background-color: #1f2937; /* 深色底色，与登录界面一致 */
      overflow: hidden;
    }

    /* 粒子效果画布 */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 现代化的加载器容器 */
    #loader-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 玻璃拟态效果的加载器卡片 */
    #loader-card {
      border-radius: 20px;
      padding: 40px;
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      min-width: 300px;
    }

    /* 现代化的加载器动画 */
    #loader {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      position: relative;
      background: linear-gradient(45deg, #409EFF, #67C23A);
      border-radius: 50%;
      animation: modern-spin 2s linear infinite;
    }

    #loader::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      background: rgba(20, 20, 30, 0.8);
      border-radius: 50%;
      backdrop-filter: blur(5px);
    }

    #loader::after {
      content: '';
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: linear-gradient(45deg, #409EFF, #67C23A);
      border-radius: 50%;
      animation: modern-spin 1.5s linear infinite reverse;
    }

    @keyframes modern-spin {
      0% {
        transform: rotate(0deg);
        filter: hue-rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
        filter: hue-rotate(360deg);
      }
    }

    /* 脉冲效果 */
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border: 2px solid rgba(64, 158, 255, 0.3);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    /* 移除旧的加载器样式 */
    .loader-section {
      display: none;
    }

    /* 加载文字样式 */
    .load_title {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    .load_subtitle {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      text-align: center;
      font-style: italic;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* 渐变文字效果 */
    .gradient-text {
      background: linear-gradient(45deg, #409EFF, #67C23A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 3s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0%, 100% {
        filter: hue-rotate(0deg);
      }
      50% {
        filter: hue-rotate(90deg);
      }
    }

    /* 进度条 */
    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #409EFF, #67C23A);
      border-radius: 2px;
      animation: progress-fill 3s ease-in-out infinite;
    }

    @keyframes progress-fill {
      0% {
        width: 0%;
        transform: translateX(-100%);
      }
      50% {
        width: 100%;
        transform: translateX(0%);
      }
      100% {
        width: 100%;
        transform: translateX(100%);
      }
    }

    /* 隐藏加载器的动画 */
    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-100%);
      transition: all 0.8s ease-out;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      #loader-card {
        margin: 20px;
        padding: 30px 20px;
        min-width: unset;
      }
      
      .load_title {
        font-size: 16px;
      }
      
      .load_subtitle {
        font-size: 12px;
      }
    }
  </style>
  </head>
  <body>
    <div id="app">
	    <div id="loader-wrapper">
        <canvas id="particle-canvas"></canvas>
        <div id="loader-container">
          <div id="loader-card">
            <div class="pulse-ring"></div>
            <div id="loader"></div>
            <div class="load_title">
              <span class="gradient-text">正在加载系统资源</span>
            </div>
            <div class="load_subtitle">请耐心等待，为您提供最佳体验</div>
            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>
          </div>
        </div>
		</div>
	</div>
  
  <script>
    // 粒子动画效果，与登录界面一致
    function initParticleAnimation() {
      const canvas = document.getElementById('particle-canvas');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      let particles = [];
      const particleCount = 80;

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 2 + 1;
          this.speedX = Math.random() * 1.5 - 0.75;
          this.speedY = Math.random() * 1.5 - 0.75;
          this.color = '#ffffff';
          this.opacity = Math.random() * 0.5 + 0.3;
        }
        
        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        
        draw() {
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function init() {
        particles = [];
        for (let i = 0; i < particleCount; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          particles.push(new Particle(x, y));
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        connect();
        requestAnimationFrame(animate);
      }

      function connect() {
        for (let a = 0; a < particles.length; a++) {
          for (let b = a; b < particles.length; b++) {
            let distance = Math.hypot(particles[a].x - particles[b].x, particles[a].y - particles[b].y);
            if (distance < 120) {
              const opacity = 1 - (distance / 120);
              ctx.globalAlpha = opacity * 0.3;
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(particles[a].x, particles[a].y);
              ctx.lineTo(particles[b].x, particles[b].y);
              ctx.stroke();
            }
          }
        }
      }

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
      });

      init();
      animate();
    }

    // 页面加载完成后隐藏加载器
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.body.classList.add('loaded');
      }, 1000);
    });

    // 初始化粒子动画
    document.addEventListener('DOMContentLoaded', initParticleAnimation);
  </script>
  </body>
</html>
