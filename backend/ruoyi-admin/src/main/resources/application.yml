# Public example configuration. Set real values through environment variables.
server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
token:
  secret: ${TOKEN_SECRET}
